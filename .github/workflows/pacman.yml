name: Generate Pacman Contribution Graph

on:
  # প্রতি ২৪ ঘণ্টায় একবার স্বয়ংক্রিয়ভাবে চলবে
  schedule:
    - cron: "0 0 * * *"
  
  # আপনাকে ম্যানুয়ালি রান করার সুযোগ দেবে
  workflow_dispatch:
  
  # মেইন ব্রাঞ্চে কোনো পুশ হলে রান হবে
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Pacman অ্যানিমেশন জেনারেট করার অফিশিয়াল অ্যাকশন
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
          
      # জেনারেট হওয়া ফাইলটি 'pacman-output' ব্রাঞ্চে পুশ করার জন্য
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
